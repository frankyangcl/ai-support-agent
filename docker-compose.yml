services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-support-agent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_support_agent

    ports:
      - "5433:5432"

    volumes:
      - ai-support-agent-postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d ai_support_agent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ai-support-agent-postgres-data: