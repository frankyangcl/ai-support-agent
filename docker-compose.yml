services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ai-support-agent-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_support_agent

    ports:
      - "6000:5432"

    volumes:
      - ai-support-agent-postgres-data:/var/lib/postgresql/data
      - ./backend/migrations:/docker-entrypoint-initdb.d:ro

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d ai_support_agent"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: ai-support-agent-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/ai_support_agent?sslmode=disable
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      BAILIAN_BASE_URL: ${BAILIAN_BASE_URL}
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}

    ports:
      - "8080:8080"

    volumes:
      - ai-support-agent-uploads:/app/uploads

    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8080

    container_name: ai-support-agent-frontend
    restart: unless-stopped

    environment:
      API_BASE_URL: http://backend:8080

    ports:
      - "4000:3000"

    depends_on:
      - backend

volumes:
  ai-support-agent-postgres-data:
  ai-support-agent-uploads:
